{% load static %}
{% load i18n %}
{% comment %}modal{% endcomment %}
<div id="message-modal" class="w-full h-screen transition-all duration-100 fixed inset-0 bg-black/90 backdrop-0 hidden justify-center items-center z-50">
    <div class="origin-center bg-white dark:bg-[#121212] rounded-xl px-4 py-2 max-w-[25rem] lg:max-w-[30rem]">
        {% comment %}header{% endcomment %}
        <div class="flex justify-start items-center py-1">
            <h1 id="mess-mod-title" class="text-lg font-semibold text-black dark:text-white"></h1>
        </div>
        {% comment %}body{% endcomment %}
        <div class="flex justify-start items-center py-1">
            <h4 id="mess-mod-message" class="text-[15px] lg:font-medium text-black/70 dark:text-white/50"></h4>
        </div>
        {% comment %}btn{% endcomment %}
        <div class="flex justify-end items-center py-2 mt-2 mr-7 gap-x-13">
            <button type="button" id="mess-mod-nega-btn" class="text-[17px] font-medium text-black/80 dark:text-white outline-0" onclick="messagemodelclose();">
                {% trans 'No' %}
            </button>
            <button type="button" id="mess-mod-posi-btn" class="text-[17px] font-medium text-black/80 dark:text-white outline-0"></button>
        </div>
    </div>
</div>
