{% load static %}
{% load i18n %}
<header class="sticky top-0 left-0 z-50 w-full bg-white dark:bg-black backdrop-blur-md px-2 py-2 gap-2">
  {% comment %}menu bar button{% endcomment %}
  <button id="p-menu-btn" class="rounded-lg flex lg:hidden justify-start items-center border border-black/10 dark:border-white/10 px-2 py-2 w-fit">
    {% comment %} <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-text-align-start-icon lucide-text-align-start text-orange-500">
      <path d="M21 5H3" />
      <path d="M15 12H3" />
      <path d="M17 19H3" />
    </svg> {% endcomment %}
    <svg xmlns="{% static 'icons/text-align-justify.svg' %}" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-text-align-justify-icon lucide-text-align-justify text-black/80 dark:text-white/80">
      <path d="M3 5h18" />
      <path d="M3 12h18" />
      <path d="M3 19h18" />
    </svg>
  </button>

  {% comment %}location box{% endcomment %}
  <div class="p-location-box rounded-lg hidden lg:flex justify-center items-center border border-black/10 dark:border-white/10 px-2 py-1 gap-2 w-fit">
    <svg xmlns="{% static 'icons/map-pin.svg' %}" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin-icon lucide-map-pin text-orange-500">
      <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" />
      <circle cx="12" cy="10" r="3" />
    </svg>
    <span class="text-base">{% trans 'Add Address' %}</span>
  </div>
</header>
